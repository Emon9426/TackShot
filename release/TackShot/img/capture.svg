    <rect x="229" y="213" width="10" height="10"/><rect x="346" y="213" width="10" height="10"/>
  </g>
  <g stroke="#0f172a" stroke-width="5"><line x1="235" y1="278" x2="235" y2="289"/><line x1="224" y1="294" x2="246" y2="294"/><line x1="235" y1="299" x2="235" y2="310"/></g>
  <g stroke="#ffffff" stroke-width="2"><line x1="235" y1="278" x2="235" y2="289"/><line x1="224" y1="294" x2="246" y2="294"/><line x1="235" y1="299" x2="235" y2="310"/></g>
  <text x="234" y="322" text-anchor="middle" fill="#334155" font-size="13">自由框选：选区白色半透明高亮，实时显示坐标尺寸</text>
