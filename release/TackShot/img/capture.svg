  <text x="88" y="77" fill="#e2e8f0" font-size="12" font-family="Consolas, monospace">320,240 · 800×500</text>
  <g fill="#3b82f6" stroke="#ffffff" stroke-width="1.5">
    <rect x="114" y="84" width="10" height="10"/><rect x="229" y="84" width="10" height="10"/>
