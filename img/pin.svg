<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="Segoe UI, Microsoft YaHei, sans-serif">
  <rect width="920" height="300" fill="#f1f5f9"/>
  <!-- 桌面背景示意 -->
  <rect x="30" y="20" width="560" height="240" rx="6" fill="#cbd5e1"/>
  <rect x="90" y="60" width="300" height="30" fill="#94a3b8"/>
  <rect x="90" y="100" width="220" height="16" fill="#a8b3c2"/>
  <!-- 贴图窗口：黑色边框 -->
  <rect x="150" y="70" width="360" height="150" fill="#ffffff"/>
  <rect x="150" y="70" width="360" height="150" fill="url(#g)" opacity="0.5"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#93c5fd"/><stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
  </defs>
  <rect x="150" y="70" width="360" height="150" fill="none" stroke="#000000" stroke-width="4"/>
  <text x="330" y="150" text-anchor="middle" fill="#334155" font-size="14">截图内容（黑边框标示）</text>
  <!-- 悬浮菜单 -->
  <g>
    <rect x="185" y="78" width="296" height="26" rx="7" fill="#1e2530" opacity="0.94" stroke="#334155"/>
    <g font-size="12" fill="#e2e8f0" text-anchor="middle">
      <text x="208" y="95" fill="#f59e0b">✎ 编辑</text>
      <text x="258" y="95">⧉ 复制</text>
      <text x="310" y="95">⭳ 保存</text>
      <text x="352" y="95">－ 100% ＋</text>
      <text x="418" y="95">◐</text>
      <text x="448" y="95" fill="#f87171">✕</text>
    </g>
  </g>
  <text x="330" y="285" text-anchor="middle" fill="#334155" font-size="13">贴图：黑色边框 · 置顶 · 悬停浮现菜单 · 可继续编辑并同步剪贴板</text>
  <!-- 手势表 -->
  <g font-size="12.5">
    <rect x="620" y="30" width="280" height="200" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
    <text x="640" y="58" fill="#0f172a" font-weight="bold">贴图手势 / Pin gestures</text>
    <g fill="#334155">
      <text x="640" y="84">拖动 — 移动贴图 / drag to move</text>
      <text x="640" y="108">滚轮 — 缩放 10%–800% / wheel zoom</text>
      <text x="640" y="132">Ctrl+滚轮 — 透明度 / opacity</text>
      <text x="640" y="156">双击 / Esc — 关闭 / close</text>
      <text x="640" y="180">悬停 → ✏ 编辑 — 就地标注 / edit in place</text>
      <text x="640" y="204">编辑完成自动同步剪贴板 / auto sync</text>
    </g>
  </g>
</svg>
